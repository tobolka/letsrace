name: Pipeline (cloud worker)

# The pipeline's work that must go on while the Mac is shut. One job at a time moves here from
# vercel.json; a job has exactly one scheduler, so its line leaves vercel.json in the same change
# that gives it a schedule here. See docs/pipeline-v2.md, part 6.
#
# What runs here on a schedule is only what nothing else does while the Mac is shut: reading
# other people's websites. The five jobs in vercel.json stay there; they already run without the
# Mac, and moving them would save almost no function CPU (they wait on the network, they do not compute).
#
# By hand:  gh workflow run pipeline.yml -f job=find-documents
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: weather-history
        type: choice
        options: [find-documents, weather-history]

concurrency:
  group: pipeline-${{ inputs.job || 'find-documents' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weather-history:
    if: inputs.job == 'weather-history'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The script reads .env.local when there is one; here the values come from the secrets below.
      - run: touch .env.local
      - name: Warm weather history
        run: npx tsx scripts/warm-weather-history.ts 150
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Regulations on races' own sites, through the queue and the gate. The dispatcher holds the keys
  # and starts each reader with an environment of its own, without them. Does nothing while the Mac
  # has reported within the last half hour; the queue keeps the two from reading one site twice.
  find-documents:
    if: github.event_name == 'schedule' || inputs.job == 'find-documents'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Find regulations on race sites
        run: npx tsx scripts/pipeline2-find-documents.ts --server --sites=60 --unless-heard=mac:30
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
